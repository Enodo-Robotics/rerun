name: Setup
description: >
  What the jobs on the `claude` runner (docker/claude-runner, which has the
  toolchains) need in a fresh checkout: a Python venv, kept between jobs, with
  the PyO3 config that every cargo build of the workspace reads
  (.cargo/config.toml), and the Git LFS files (snapshot images, test assets).
  This repo's LFS storage only has the files the fork added, so the rest come
  from upstream rerun.
inputs:
  lfs:
    description: Fetch the Git LFS files.
    default: "true"

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        venv="$HOME/cache/venv"
        [ -x "$venv/bin/python" ] || python -m venv "$venv"
        echo "VIRTUAL_ENV=$venv" >> "$GITHUB_ENV"
        echo "$venv/bin" >> "$GITHUB_PATH"
        "$venv/bin/pip" install -q ./rerun_pixi_env maturin==1.9.6
        PIXI_PROJECT_ROOT="$PWD" "$venv/bin/ensure-pyo3-build-cfg"
    - if: inputs.lfs == 'true'
      shell: bash
      run: |
        set -uo pipefail
        # Missing objects are expected from each side; the checkout below
        # reports what is still missing.
        git lfs fetch origin HEAD 2> /dev/null || true
        git lfs fetch https://github.com/rerun-io/rerun.git HEAD 2> /dev/null || true
        git lfs checkout
