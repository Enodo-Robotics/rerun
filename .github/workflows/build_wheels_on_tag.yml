name: Build Wheels on Tag

on:
  push:
    tags:
      - "RRL-v*"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-wheel:
    name: "Build Wheel (self-hosted, Docker)"
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Extract tag name
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building for tag: $TAG"

      - name: Build Docker image
        run: docker build -t rerun-builder -f .github/Dockerfile.build .

      - name: Build wheel inside Docker
        run: |
          mkdir -p wheels
          docker run --rm \
            -v "${{ github.workspace }}:/build" \
            -w /build \
            rerun-builder \
            bash -c '
              set -euo pipefail

              echo "==> Building CLI binary..."
              cargo build --release --bin rerun

              echo "==> Copying CLI into Python package..."
              cp ./target/release/rerun ./rerun_py/rerun_sdk/rerun_cli/rerun

              echo "==> Building Python wheel..."
              RERUN_BUILDING_WHEEL=1 maturin build \
                --release \
                --manifest-path rerun_py/Cargo.toml \
                --features nasm \
                --out ./wheels/

              echo "==> Verifying custom features..."
              python3 -m zipfile -e ./wheels/rerun_sdk-*.whl /tmp/extracted_wheel
              chmod +x /tmp/extracted_wheel/rerun_sdk/rerun_cli/rerun
              /tmp/extracted_wheel/rerun_sdk/rerun_cli/rerun --help | grep -q "save-dir" \
                && echo "Custom features verified!" \
                || (echo "ERROR: Custom features missing!" && exit 1)
            '

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ steps.version.outputs.tag }}
          path: ./wheels/*.whl

      - name: Create release and upload wheel
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Create release if it doesn't exist
          gh release view "$TAG" || gh release create "$TAG" --title "$TAG" --generate-notes
          # Upload wheel (overwrite if exists)
          gh release upload "$TAG" ./wheels/*.whl --clobber
