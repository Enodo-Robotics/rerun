name: Claude CI fix

# When CI fails on an open PR Claude looks after
# (.github/scripts/is-claude-pr.sh), Claude reads the failed logs
# and pushes a fix (or reruns a job it shows is flaky). It stops after three
# failed CI runs in a row on the branch and asks for help on the PR instead.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

jobs:
  check:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-24.04
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      attempts: ${{ steps.pr.outputs.attempts }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if ! .github/scripts/is-claude-pr.sh "$PR"; then echo "Claude does not look after PR #$PR"; exit 0; fi
          # Failed CI runs in a row on this branch, newest first.
          attempts=$(gh run list --repo "$REPO" --workflow CI --branch "$BRANCH" --limit 10 \
            --json conclusion \
            --jq '[.[].conclusion | select(. != "")] as $c | ([$c | to_entries[] | select(.value != "failure") | .key] | first) // ($c | length)')
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"

  fix:
    needs: check
    if: needs.check.outputs.pr != ''
    concurrency:
      group: claude-${{ needs.check.outputs.pr }}
      cancel-in-progress: false
    runs-on: claude
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
      - uses: ./.github/actions/claude-setup
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The failing push was usually Claude's own.
          allowed_bots: claude
          additional_permissions: |
            actions: write
          prompt: |
            Repository: ${{ github.repository }}. CI run ${{ github.event.workflow_run.html_url }}
            (id ${{ github.event.workflow_run.id }}) failed on PR #${{ needs.check.outputs.pr }}, branch
            `${{ github.event.workflow_run.head_branch }}` (checked out). This is failed CI run
            ${{ needs.check.outputs.attempts }} in a row on the branch. Follow "When CI fails" in CLAUDE.md.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 200
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
