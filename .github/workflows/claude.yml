name: Claude

# Claude works on this repo from GitHub; "Working from GitHub" in CLAUDE.md
# has the procedures it follows.
# - An issue that mentions @claude becomes a PR.
# - @claude in a comment or review on an issue or PR gets an answer, or a
#   change pushed to the PR (which reruns CI and the preview).
# Claude pushes with the Claude GitHub App's token, so its pushes trigger the
# other workflows, as a person's would.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  # 👀 on the request as soon as it arrives, before Claude's job waits for its
  # turn or sets up.
  seen:
    # Claude's own comments can quote "@claude"; they never trigger it.
    if: |
      github.actor != 'claude[bot]' && (
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')))
    runs-on: claude-light
    steps:
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT: ${{ github.event.comment.id }}
        run: |
          case "$EVENT" in
            issues) target="issues/$ISSUE" ;;
            issue_comment) target="issues/comments/$COMMENT" ;;
            pull_request_review_comment) target="pulls/comments/$COMMENT" ;;
            *) exit 0 ;; # Reviews take no reactions.
          esac
          gh api -X POST "repos/$REPO/$target/reactions" -f content=eyes > /dev/null

  claude:
    needs: seen
    # One Claude run at a time per issue or PR (shared with claude-sync,
    # claude-ci-fix and claude-merge), so two runs never push to one branch.
    # Job-level, so runs that skip the job never take a place in the queue.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: claude
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/claude-setup
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --max-turns 300
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,WebFetch,WebSearch"
