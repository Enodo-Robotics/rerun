name: Publish

# Releases build on the public fork, Enodo-Robotics/rerun, where GitHub-hosted
# runners are free and the wheel URLs that enodo_motion and enodo_stream pin
# keep working. Pushing an RRL-v* tag here (Claude does it on "@claude
# release") pushes the tagged commit to the public fork's main, and the tag;
# the tag runs build_wheels_on_tag.yml there, which uploads the wheels to the
# public release.
#
# Pushes over SSH with a deploy key of the public fork that may write
# (secret PUBLIC_FORK_DEPLOY_KEY). Never forces: if the public main has
# commits this one lacks, the push fails and says so.
on:
  push:
    tags: ["RRL-v*"]

permissions:
  contents: read

jobs:
  publish:
    # Not on the public fork Enodo-Robotics/rerun, which only builds release wheels.
    if: github.repository == 'Enodo-Robotics/rerun-dev'
    runs-on: claude-light
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          KEY: ${{ secrets.PUBLIC_FORK_DEPLOY_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/public_fork && chmod 600 ~/.ssh/public_fork
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/public_fork -o IdentitiesOnly=yes"
          git remote add public git@github.com:Enodo-Robotics/rerun.git
          git fetch public main
          # GitHub rejects a push that references LFS objects the public fork doesn't store
          # (GH008), so upload the ones the new commits add first. The checkout has no LFS
          # files and the full set is ~700 MB, so fetch only the paths changed since the public
          # main. That fetch also asks for older versions of those paths, which the public fork
          # already has and this repo's LFS store may lack, hence `|| true`; `git lfs push`
          # still fails if an object it needs is missing.
          paths=$(git log --name-only --format= public/main.."$TAG" | sort -u | paste -sd, -)
          git lfs fetch origin $(git rev-list public/main.."$TAG") --include="$paths" || true
          git lfs push public "$TAG"
          # The objects are uploaded; --no-verify skips the pre-push hook doing it again.
          git push --no-verify public "$TAG^{commit}:refs/heads/main" "refs/tags/$TAG"
          echo "Pushed $TAG to Enodo-Robotics/rerun: https://github.com/Enodo-Robotics/rerun/actions/workflows/build_wheels_on_tag.yml" >> "$GITHUB_STEP_SUMMARY"
