[package]
name = "rerun-logger"
authors.workspace = true
categories = ["visualization", "computer-vision", "data-processing"]
description = "Standalone Rerun data logger that buffers and saves data to .rrd files"
edition.workspace = true
homepage.workspace = true
include.workspace = true
keywords = ["logging", "data-buffer", "robotics", "visualization", "rerun"]
license.workspace = true
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

default-run = "rerun-logger"

[lints]
workspace = true

[[bin]]
name = "rerun-logger"
path = "src/bin/rerun_logger.rs"

[features]
default = ["server"]

## Support for running a gRPC server that listens to incoming log messages from a Rerun SDK.
server = ["dep:re_grpc_server", "dep:re_protos", "dep:tonic", "dep:tokio-stream", "re_sdk/server", "tokio/signal"]

## Enable faster native video decoding with assembly.
## You need to install [nasm](https://github.com/netwide-assembler/nasm) to compile with this feature.
nasm = ["re_video/nasm"]

[dependencies]
re_build_info.workspace = true
re_byte_size.workspace = true
re_chunk.workspace = true
re_chunk_store.workspace = true
re_entity_db.workspace = true
re_error.workspace = true
re_format.workspace = true
re_grpc_client.workspace = true
re_grpc_server = { workspace = true, optional = true }
re_protos = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
re_log.workspace = true
re_log_encoding.workspace = true
re_log_types.workspace = true
re_memory.workspace = true
re_sdk = { workspace = true, features = ["server"] }
re_smart_channel.workspace = true
re_tracing.workspace = true
re_uri.workspace = true
re_video.workspace = true

anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
crossbeam.workspace = true
document-features.workspace = true
indicatif.workspace = true
mimalloc = "0.1.43"
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "fs"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
assert_cmd = "2.0"
predicates = "3.0"

[build-dependencies]
re_build_tools.workspace = true